name: Publish Fibo demo

on:
  workflow_run:
    workflows: ["QA and QC"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fibo-demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install Vue app dependencies
        working-directory: apps/admin
        run: npm ci
      - name: Build the demo
        working-directory: apps/admin
        run: npm run build:pages
      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p site/admin site/prototypes
          cp -a apps/admin/dist/. site/admin/
          cp docs/prototypes/student-experience.html site/index.html
          cp docs/prototypes/question-authoring.html site/prototypes/question-authoring.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload page artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
